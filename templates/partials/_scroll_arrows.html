{% load i18n %}
{% comment %}
Previous / next buttons for a row that scrolls sideways (.target-picker): each
moves it by most of its visible width. Include it in the same Alpine scope as
the row.

Expects: ref (the row's x-ref).
{% endcomment %}
<div class="flex items-center gap-1 flex-shrink-0">
    <button type="button" class="w-7 h-7 rounded-md border border-neutral-300 bg-white flex items-center justify-center text-neutral-600 hover:bg-neutral-50 hover:text-neutral-900 cursor-pointer"
            @click="$refs.{{ ref }}.scrollBy({ left: -$refs.{{ ref }}.clientWidth * 0.8, behavior: 'smooth' })"
            title="{% translate 'Previous' %}" aria-label="{% translate 'Previous' %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button type="button" class="w-7 h-7 rounded-md border border-neutral-300 bg-white flex items-center justify-center text-neutral-600 hover:bg-neutral-50 hover:text-neutral-900 cursor-pointer"
            @click="$refs.{{ ref }}.scrollBy({ left: $refs.{{ ref }}.clientWidth * 0.8, behavior: 'smooth' })"
            title="{% translate 'Next' %}" aria-label="{% translate 'Next' %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </button>
</div>
