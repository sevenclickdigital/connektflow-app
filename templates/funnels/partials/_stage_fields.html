{% load i18n %}
{% comment %}A stage's name, colour and kind, for the add and edit forms. Context: name, color, kind, stage_colors, stage_kinds.{% endcomment %}
<label class="flex-1 min-w-[10rem]">
    <span class="block text-xs font-semibold text-neutral-600 mb-1">{% translate "Stage" %}</span>
    <input type="text" name="name" value="{{ name }}" required maxlength="60" class="form-input-styled !py-1.5" placeholder="{% translate 'e.g. Proposal' %}">
</label>
<label>
    <span class="block text-xs font-semibold text-neutral-600 mb-1">{% translate "Color" %}</span>
    <select name="color" class="form-input-styled bb-select !py-1.5 !w-auto">
        {% for value, label in stage_colors %}<option value="{{ value }}" {% if value == color %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
</label>
<label>
    <span class="block text-xs font-semibold text-neutral-600 mb-1">{% translate "Kind" %}</span>
    <select name="kind" class="form-input-styled bb-select !py-1.5 !w-auto">
        {% for value, label in stage_kinds %}<option value="{{ value }}" {% if value == kind %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
</label>
