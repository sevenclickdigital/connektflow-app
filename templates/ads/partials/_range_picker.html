{% load i18n %}
<div class="inline-flex rounded-full border border-neutral-300 bg-white p-0.5" role="group" aria-label="{% translate 'Period' %}">
    {% for choice in range_choices %}
    <a href="?range={{ choice }}" class="px-3 py-1 text-xs font-semibold rounded-full {% if choice == days %}bg-brand-700 text-white{% else %}text-neutral-600 hover:text-neutral-950{% endif %}">{% blocktranslate %}{{ choice }} days{% endblocktranslate %}</a>
    {% endfor %}
</div>
