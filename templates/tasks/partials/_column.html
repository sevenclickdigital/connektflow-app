{% load i18n %}
<section class="task-column{% if column.is_done %} is-done-col{% elif column.is_review %} is-review-col{% endif %}" data-column-id="{{ column.id }}"
         x-data="{ menu: false, renaming: false }">
    <header class="flex items-center justify-between gap-2 px-3 pt-3 pb-2">
        <div class="flex items-center gap-2 min-w-0" x-show="!renaming">
            <h2 class="text-[13px] font-bold text-stone-800 truncate">{{ column.name }}</h2>
            <span class="inline-flex items-center justify-center min-w-[20px] h-5 px-1.5 rounded-full text-[11px] font-semibold bg-white/80 text-stone-500">{{ column.task_list|length }}</span>
        </div>
        {% if can_edit %}
        <form x-show="renaming" x-cloak class="flex-1"
              hx-post="{% url 'tasks:column_rename' workspace_id=workspace.id column_id=column.id %}" hx-swap="none">
            <input name="name" value="{{ column.name }}" maxlength="100" x-ref="rename"
                   @keydown.escape="renaming = false" @blur="$el.form.requestSubmit()"
                   class="form-input-styled w-full text-sm py-1">
        </form>
        <div class="relative flex-shrink-0" x-show="!renaming">
            <button type="button" @click="menu = !menu" class="w-6 h-6 rounded-md text-stone-500 hover:bg-white/80 flex items-center justify-center"
                    aria-label="{% translate 'Column options' %}">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="6" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="18" r="1.5"/></svg>
            </button>
            <div x-show="menu" x-cloak @click.outside="menu = false"
                 class="absolute right-0 top-full mt-1 bg-white rounded-lg shadow-lg ring-1 ring-stone-200 py-1 z-20 min-w-[170px] text-xs">
                <button type="button" class="w-full text-left px-3 py-1.5 hover:bg-stone-50"
                        @click="menu = false; renaming = true; $nextTick(() => $refs.rename.focus())">{% translate "Rename" %}</button>
                <button type="button" class="w-full text-left px-3 py-1.5 hover:bg-stone-50" @click="menu = false; moveColumn('{{ column.id }}', -1)">{% translate "Move left" %}</button>
                <button type="button" class="w-full text-left px-3 py-1.5 hover:bg-stone-50" @click="menu = false; moveColumn('{{ column.id }}', 1)">{% translate "Move right" %}</button>
                {% if not column.task_list %}
                <button type="button" class="w-full text-left px-3 py-1.5 text-red-600 hover:bg-red-50"
                        hx-post="{% url 'tasks:column_delete' workspace_id=workspace.id column_id=column.id %}" hx-swap="none">{% translate "Delete column" %}</button>
                {% endif %}
            </div>
        </div>
        {% endif %}
    </header>

    <div class="task-drop"
         @dragover="dragOver($event)" @dragleave="dragLeave($event)" @drop="drop($event, '{{ column.id }}')">
        {% for task in column.task_list %}
            {% include "tasks/partials/_task_card.html" %}
        {% endfor %}
    </div>

    {% if can_edit %}
    <div class="px-2 pb-2" x-data="{ adding: false }">
        <button type="button" x-show="!adding" @click="adding = true; $nextTick(() => $refs.title.focus())"
                class="flex items-center gap-1.5 w-full px-2 py-1.5 text-[12.5px] font-medium text-stone-500 hover:text-stone-700 hover:bg-white/70 rounded-lg">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            {% translate "Add task" %}
        </button>
        <form x-show="adding" x-cloak hx-post="{% url 'tasks:task_create' workspace_id=workspace.id %}" hx-swap="none"
              @htmx:after-request="$el.reset(); $refs.title.focus()">
            <input type="hidden" name="column" value="{{ column.id }}">
            <input x-ref="title" name="title" type="text" maxlength="255" required autocomplete="off"
                   placeholder="{% translate 'Task title' %}" @keydown.escape="adding = false"
                   class="form-input-styled w-full text-sm">
            <div class="flex items-center gap-2 mt-2">
                <button type="submit" class="btn-brand text-xs px-3 py-1">{% translate "Add" %}</button>
                <button type="button" @click="adding = false" class="text-xs font-medium text-stone-500 hover:text-stone-700">{% translate "Cancel" %}</button>
            </div>
        </form>
    </div>
    {% endif %}
</section>
