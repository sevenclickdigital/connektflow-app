{% comment %}
Styles of the task board, its card and the art request form. Included once per page.
{% endcomment %}
<style nonce="{{ request.csp_nonce }}">
    .task-board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 16px; align-items: flex-start; min-height: calc(100vh - 190px); }
    .task-column { flex: 0 0 280px; background: #F5F3FF; border-radius: 14px; display: flex; flex-direction: column; max-height: calc(100vh - 190px); }
    .task-column.is-done-col { background: #F0FDF4; }
    .task-column.is-review-col { background: #F9F5FF; }
    .task-drop { flex: 1 1 auto; overflow-y: auto; padding: 0 8px 4px; min-height: 40px; border-radius: 10px; transition: background-color .12s ease; }
    .task-drop.is-over { background: rgba(124, 58, 237, .08); }
    .task-card { background: white; border-radius: 10px; padding: 10px 11px; margin-bottom: 8px; border: 1px solid #E5E7EB;
        box-shadow: 0 1px 2px rgba(28,25,23,.05); cursor: pointer; user-select: none; transition: box-shadow .12s ease, border-color .12s ease; }
    .task-card:hover { border-color: #CBD5E1; box-shadow: 0 3px 10px rgba(28,25,23,.08); }
    .task-card.is-dragging { opacity: .45; }
    .task-card.is-complete .task-card-title { color: #64748B; text-decoration: line-through; }
    .task-progress { height: 4px; border-radius: 9999px; background: #E5E7EB; overflow: hidden; }
    .task-progress > span { display: block; height: 100%; border-radius: inherit; background: #7C3AED; }
    .task-progress.is-full > span { background: #22C55E; }
    .task-avatar { width: 22px; height: 22px; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center;
        font-size: 10px; font-weight: 700; color: #475569; background: #E5E7EB; border: 2px solid white; margin-left: -6px; }
    .task-avatar:first-child { margin-left: 0; }
    .task-pill { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: 9999px; font-size: 10.5px; font-weight: 600; line-height: 17px; }
    .task-pill--high { background: #FEE2E2; color: #B91C1C; }
    .task-pill--medium { background: #FEF3C7; color: #B45309; }
    .task-pill--low { background: #F5F3FF; color: #475569; }
    .task-pill--due { background: #F5F3FF; color: #475569; }
    .task-pill--overdue { background: #FEE2E2; color: #B91C1C; }
    .task-pill--art { background: #EDE9FE; color: #6D28D9; }
    .task-modal-backdrop { position: fixed; inset: 0; z-index: 70; background: rgba(28,25,23,.45); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow-y: auto; }
    .task-modal { background: white; border-radius: 16px; width: 100%; max-width: 1040px; box-shadow: 0 24px 60px rgba(28,25,23,.3); }
    #task-modal-body:empty::before, #task-modal-body[data-loading]::before { content: ""; display: block; height: 220px; }
    .task-check { width: 18px; height: 18px; border-radius: 5px; border: 2px solid #CBD5E1; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; background: white; }
    .task-check.is-on { background: #22C55E; border-color: #22C55E; color: white; }
    .task-field-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #94A3B8; margin-bottom: 4px; }
    .task-up-busy { display: none; }
    .htmx-request .task-up-idle { display: none; }
    .htmx-request .task-up-busy { display: inline; }
    .task-modal-grid { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); }
    .task-modal-main, .task-modal-side { min-width: 0; }
    .task-modal-side { background: #FAFAFF; border-top: 1px solid #F5F3FF; border-radius: 0 0 16px 16px; }
    .task-modal-close { position: absolute; top: 12px; right: 12px; z-index: 10; }
    @media (min-width: 768px) {
        .task-modal-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
        .task-modal-side { border-top: 0; border-left: 1px solid #F5F3FF; border-radius: 0 16px 16px 0; max-height: 82vh; overflow-y: auto; }
    }
    .art-format { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 14px; border: 1.5px solid #E5E7EB; background: white; cursor: pointer; transition: border-color .12s ease, box-shadow .12s ease; }
    .art-format:hover { border-color: #CBD5E1; box-shadow: 0 4px 14px rgba(28,25,23,.07); }
    .art-format:has(input:checked) { border-color: #7C3AED; box-shadow: 0 0 0 3px rgba(124, 58, 237,.15); }
    .art-format:has(input:focus-visible) { outline: 2px solid #7C3AED; outline-offset: 2px; }
    .art-format input { position: absolute; opacity: 0; pointer-events: none; }
    .art-shape-box { height: 96px; display: flex; align-items: center; justify-content: center; background: #FAFAFF; border-radius: 10px; }
    .art-shape { background: linear-gradient(135deg, #E9D5FF, #D8B4FE); border-radius: 4px; max-width: 78%; max-height: 80px; }
    .art-format:has(input:checked) .art-shape { background: linear-gradient(135deg, #A855F7, #7C3AED); }
    .art-tick { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 9999px; border: 2px solid #CBD5E1; background: white; display: flex; align-items: center; justify-content: center; color: white; }
    .art-format:has(input:checked) .art-tick { background: #7C3AED; border-color: #7C3AED; }
    .art-request-grid { display: grid; grid-template-columns: minmax(0, 1fr); }
    .art-request-side { background: #FAFAFF; border-top: 1px solid #F5F3FF; }
    @media (min-width: 1024px) {
        .art-request-grid { grid-template-columns: minmax(0, 1fr) 320px; }
        .art-request-side { border-top: 0; border-left: 1px solid #F5F3FF; border-radius: 0 16px 16px 0; }
    }
</style>
