{% comment %}
Styles of the task board, its card and the art request form. Included once per page.
{% endcomment %}
<style nonce="{{ request.csp_nonce }}">
    {# The composer's thumbnail controls (settings, menu), for the delivered arts in a task's checklist. #}
    {% include "composer/partials/_media_thumb_styles.html" %}
    /* The board: the columns side by side (.kanban-* in styles.css), scrolling sideways when they don't fit.
       It takes what is left of the window's height (flex-1 down from the page), and every column stretches
       to it; a column with more cards than that grows, and the page scrolls, as a web page does. */
    .task-board { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 4px; align-items: stretch; min-height: 420px; }
    .task-board .kanban-column { min-height: 0; max-height: none; }
    .task-board .kanban-cards { overflow-y: visible; }
    .task-board .kanban-column.is-closed { min-width: 56px; flex: 0 0 56px; }
    .kanban-column-strip.drag-over { background: var(--kanban-tone-badge); }
    .task-card { cursor: pointer; user-select: none; }
    .task-card.is-dragging { opacity: .5; transform: rotate(2deg); }
    /* The new task window (tasks/partials/_new_item_modal.html).
       The form's body scrolls between its header and its footer; every box between the panel and the
       body is a flex column with min-height: 0, or the body never scrolls. */
    .new-item-overlay { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(15, 23, 42, 0.35); backdrop-filter: blur(2px); }
    .new-item-panel { width: 100%; max-width: 1120px; height: min(860px, calc(100vh - 32px)); display: flex; background: white; border-radius: 20px; box-shadow: var(--shadow-xl); overflow: hidden; }
    .new-item-main { position: relative; flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    /* The task's form: its fields on the left, its checklists on the right, each scrolling on its own. */
    .new-item-split { flex: 1; min-height: 0; display: flex; }
    .new-item-body { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: 16px 32px 24px; }
    .new-item-checklists { width: 380px; flex-shrink: 0; min-height: 0; overflow-y: auto; padding: 24px; background: color-mix(in srgb, var(--brand-50) 70%, white); border-left: 1px solid var(--neutral-200); }
    .new-item-checklist { padding: 12px; border-radius: 12px; border: 1px solid var(--neutral-200); background: white; }
    .new-item-add-checklist { margin-top: 12px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px; border-radius: 12px; border: 1.5px dashed var(--brand-300); font-size: 13px; font-weight: 600; color: var(--brand-700); cursor: pointer; transition: background .12s ease; }
    .new-item-add-checklist:hover { background: var(--brand-50); }
    .new-item-footer { display: flex; align-items: center; gap: 12px; padding: 16px 32px; border-top: 1px solid var(--neutral-200); }
    /* "Request arts": the switch in a box that, switched on, holds the formats, the briefing and the caption. */
    .new-item-art { border: 1px solid var(--neutral-200); border-radius: 14px; background: color-mix(in srgb, var(--brand-50) 35%, white); }
    .new-item-art.is-on { border-color: var(--brand-300); }
    .new-item-art-switch { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
    .new-item-art-body { min-width: 0; padding: 4px 16px 16px; }
    /* "Add" a reference photo: a dashed square like the idea window's media "Add". */
    .task-reference-add { width: 80px; height: 80px; border-radius: 12px; border: 1.5px dashed var(--brand-300); background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; transition: background .12s ease; }
    .task-reference-add:hover { background: var(--brand-50); }
    .new-item-label { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
    fieldset:disabled .new-item-chipbox { background: var(--neutral-50); cursor: default; }
    /* A task's locked fields (its window before "Edit"): nothing opens, not even the boxes that aren't inputs. */
    fieldset.is-locked { pointer-events: none; }
    fieldset.is-locked .form-input-styled, fieldset.is-locked .new-item-chipbox, fieldset.is-locked [role="button"] { background: var(--neutral-50); color: var(--neutral-700); }
    .new-item-dot { position: absolute; left: 12px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 9999px; background: var(--kanban-tone-ink); pointer-events: none; }
    /* A box of picked chips, drawn as the form fields are (.form-input-styled: border, corners, hover, focus). */
    .new-item-chipbox { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 44px; padding: 6px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-lg); background: var(--surface-0); cursor: pointer; transition: border-color .15s ease, box-shadow .15s ease; }
    .new-item-chipbox:hover { border-color: var(--border-hover); }
    .new-item-chipbox:focus-within, .new-item-chipbox:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-ring); }
    .new-item-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: var(--brand-100); color: var(--brand-800); }
    .new-item-chip.is-person { background: white; color: var(--text-primary); border: 1px solid var(--border); padding-left: 4px; }
    .new-item-chip button { font-size: 14px; line-height: 1; color: inherit; opacity: .7; cursor: pointer; }
    .new-item-chip button:hover { opacity: 1; }
    .new-item-dropdown { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20; max-height: 240px; overflow-y: auto; padding: 4px; background: white; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); }
    .new-item-dropdown > label, .new-item-dropdown > button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border-radius: 8px; font-size: 13px; text-align: left; cursor: pointer; }
    .new-item-dropdown > label:hover, .new-item-dropdown > button:hover { background: var(--neutral-100); }
    /* A named checklist in the task's window. */
    .task-checklist { padding: 12px; border-radius: 12px; border: 1px solid var(--neutral-200); background: white; }
    @media (max-width: 900px) {
        .new-item-split { flex-direction: column; overflow-y: auto; }
        .new-item-body, .new-item-checklists { overflow-y: visible; min-height: auto; }
        .new-item-checklists { width: auto; border-left: 0; border-top: 1px solid var(--neutral-200); }
    }
    @media (max-width: 640px) {
        .new-item-body { padding: 12px 20px 20px; }
        .new-item-footer { padding: 12px 20px; }
    }
    .task-card.is-complete .task-card-title { color: #64748B; text-decoration: line-through; }
    .task-progress { height: 4px; border-radius: 9999px; background: #E5E7EB; overflow: hidden; }
    .task-progress > span { display: block; height: 100%; border-radius: inherit; background: #7C3AED; }
    .task-progress.is-full > span { background: #22C55E; }
    .task-avatar { width: 22px; height: 22px; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center;
        font-size: 10px; font-weight: 700; color: #475569; background: #E5E7EB; border: 2px solid white; margin-left: -6px; }
    .task-avatar:first-child { margin-left: 0; }
    .task-pill { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: 9999px; font-size: 10.5px; font-weight: 600; line-height: 17px; }
    .task-pill--high { background: #FEE2E2; color: #B91C1C; }
    .task-pill--medium { background: #FEF3C7; color: #B45309; }
    .task-pill--low { background: #F5F3FF; color: #475569; }
    .task-pill--due { background: #F5F3FF; color: #475569; }
    .task-pill--art { background: #EDE9FE; color: #6D28D9; }
    /* A window over the board, centred when it fits (margin-block: auto), scrolling with the backdrop when it doesn't. */
    .task-modal-backdrop { position: fixed; inset: 0; z-index: 70; background: rgba(28,25,23,.45); display: flex; align-items: flex-start; justify-content: center; padding: 16px; overflow-y: auto; }
    .task-modal { background: white; border-radius: 16px; width: 100%; max-width: 1040px; margin-block: auto; box-shadow: 0 24px 60px rgba(28,25,23,.3); }
    /* The task's window (tasks/partials/_task_modal.html): as tall as the new task window, its fields
       and its checklists each scrolling on their own, the save bar always in view. */
    .task-modal.is-detail { max-width: 1120px; height: min(860px, calc(100vh - 32px)); display: flex; overflow: hidden; border-radius: 20px; }
    .task-modal.is-detail > #task-modal-body { flex: 1; min-width: 0; display: flex; }
    .task-detail { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .task-detail-split { flex: 1; min-height: 0; display: flex; }
    .task-detail-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .task-detail-close { position: absolute; top: 16px; right: 16px; z-index: 5; }
    /* Folded (the window's default): the task's side is a strip and the checklists take the rest. */
    .task-detail-split.is-folded .task-detail-main { flex: 0 0 72px; border-right: 1px solid var(--neutral-200); }
    .task-detail-split.is-folded .new-item-checklists { flex: 1; width: auto; border-left: 0; }
    .task-detail-strip { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px 0; }
    .task-detail-strip-button { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--neutral-300); background: white; color: var(--neutral-700); cursor: pointer; }
    .task-detail-strip-button:hover { border-color: var(--brand-300); color: var(--brand-700); background: var(--brand-50); }
    @media (max-width: 900px) {
        .task-detail-split { flex-direction: column; overflow-y: auto; }
        .task-detail-main { min-height: auto; }
        .task-detail-split.is-folded .task-detail-main { flex: none; border-right: 0; border-bottom: 1px solid var(--neutral-200); }
        .task-detail-strip { flex-direction: row; justify-content: center; padding: 12px; }
        .task-detail .new-item-body, .task-detail .new-item-checklists { overflow-y: visible; }
        .task-detail .new-item-checklists { width: auto; border-left: 0; border-top: 1px solid var(--neutral-200); }
    }
    #task-modal-body:empty::before, #task-modal-body[data-loading]::before { content: ""; display: block; height: 220px; }
    .task-check { width: 18px; height: 18px; border-radius: 5px; border: 2px solid #CBD5E1; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; background: white; }
    .task-check.is-on { background: #22C55E; border-color: #22C55E; color: white; }
    .task-field-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #94A3B8; margin-bottom: 4px; }
    .task-up-busy { display: none; }
    .htmx-request .task-up-idle { display: none; }
    .htmx-request .task-up-busy { display: inline; }
    .task-modal-close { position: absolute; top: 12px; right: 12px; z-index: 10; }
    /* The art request's channels (tasks/partials/_art_formats.html): the networks listed on the
       left, the shown one's formats as cards in one row on the right, scrolling sideways; side by
       side from 640px, the list exactly as tall as the formats beside it. */
    .art-channels { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 12px; border-radius: 16px; border: 1px solid var(--neutral-200); background: color-mix(in srgb, var(--brand-50) 40%, white); }
    .art-channel-list { max-height: 228px; overflow-y: auto; padding: 4px; border-radius: 12px; border: 1px solid var(--neutral-200); background: white; }
    .art-channel { display: flex; align-items: center; gap: 8px; padding: 2px 10px 2px 2px; border-radius: 10px; }
    .art-channel + .art-channel { margin-top: 2px; }
    .art-channel:hover { background: var(--neutral-50); }
    .art-channel.is-shown { background: var(--brand-50); }
    .art-channel-name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 7px 6px; border-radius: 8px; cursor: pointer; }
    .art-channel-name:focus-visible { outline: 2px solid var(--brand-600); outline-offset: 1px; }
    .art-channel-formats { padding: 6px 4px; }
    .art-format-row { overflow-x: auto; scrollbar-width: none; padding: 3px; margin: -3px; }
    .art-format-row::-webkit-scrollbar { display: none; }
    .art-format-row .art-format { flex: 0 0 148px; }
    @media (min-width: 640px) {
        .art-channels { grid-template-columns: 220px minmax(0, 1fr); }
        /* The list takes no height of its own (contain: size): the row of cards sets it, and the list scrolls. */
        .art-channel-list { max-height: none; contain: size; }
    }
    /* A format to tick: its glyph on a lilac tile, then name, size and proportion; the tick,
       top right, fills when picked. */
    .art-format { position: relative; display: flex; flex-direction: column; align-items: flex-start; padding: 12px; border-radius: 14px; border: 1.5px solid var(--border); background: white; cursor: pointer; transition: border-color .12s ease, box-shadow .12s ease, background .12s ease; }
    .art-format:hover { border-color: var(--brand-300); box-shadow: 0 4px 14px rgba(28,25,23,.07); }
    .art-format:has(input:checked) { border-color: var(--brand-500); background: color-mix(in srgb, var(--brand-50) 60%, white); box-shadow: 0 0 0 3px rgba(124, 58, 237, .12); }
    .art-format:has(input:focus-visible) { outline: 2px solid #7C3AED; outline-offset: 2px; }
    .art-format input { position: absolute; opacity: 0; pointer-events: none; }
    .art-icon-box { align-self: center; width: 56px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--brand-50), var(--brand-100)); color: var(--brand-700); }
    .art-ratio { display: inline-flex; align-items: center; padding: 0 7px; border-radius: 9999px; font-size: 11px; font-weight: 600; line-height: 18px; background: var(--brand-50); color: var(--neutral-700); font-variant-numeric: tabular-nums; }
    .art-tick { position: absolute; top: 10px; right: 10px; width: 20px; height: 20px; border-radius: 9999px; border: 2px solid var(--neutral-400); background: white; display: flex; align-items: center; justify-content: center; color: white; }
    .art-format:has(input:checked) .art-tick { background: var(--brand-700); border-color: var(--brand-700); }
    .art-request-grid { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr auto; }
    /* The form's foot spans both columns (grid-column) and stays at the bottom while the form scrolls. */
    .art-request-footer { grid-column: 1 / -1; position: sticky; bottom: 0; z-index: 5; display: flex; justify-content: flex-end; gap: 12px; padding: 16px 24px; background: white; border-top: 1px solid var(--neutral-200); }
    .art-checklist { padding: 12px; border-radius: 12px; border: 1px solid var(--neutral-200); background: white; }
    .art-request-side { background: #FAFAFF; border-top: 1px solid #F5F3FF; }
    @media (min-width: 1024px) {
        .art-request-grid { grid-template-columns: minmax(0, 1fr) 360px; }
        .art-request-side { border-top: 0; border-left: 1px solid #F5F3FF; border-radius: 0 16px 16px 0; }
    }
</style>
