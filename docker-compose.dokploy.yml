# Dokploy deployment (Docker Compose application type).
#
# Standalone file — do NOT combine it with docker-compose.yml (that one is for
# local development). Point Dokploy's "Compose Path" at this file alone.
#
# Notes:
#   - No extra proxy. Dokploy's own Traefik terminates TLS and reverse-proxies, so
#     a second proxy binding :80/:443 would collide with it. Django's /media/
#     route serves uploads instead (SERVE_MEDIA=true, the default) — fine for
#     modest traffic; switch STORAGE_BACKEND=s3 once media volume grows, since
#     Django's static serve has no byte-range support (no video seeking).
#   - No host port publishing. Traefik reaches the app over the Docker network;
#     publishing 8000 on the host would expose it bypassing TLS.
#   - Env vars come from Dokploy's Environment tab, not an .env file: Dokploy
#     writes that tab to a .env next to this file and interpolates it here.
#   - No database here. PostgreSQL is a Dokploy database (Databases tab), so it
#     has its own lifecycle and backups and a redeploy of this stack never
#     touches it. DATABASE_URL is its "Internal Connection URL".
#   - Every service joins dokploy-network, the network Dokploy's databases and
#     Traefik live on; without it the database's internal host does not
#     resolve. Keep "Isolated Deployments" off for this application, since it
#     moves the stack to a network of its own.
#
# The site's routing is written here, as Traefik labels on `app` and
# `app-standby`, with the names Dokploy's own Traefik uses (entry points `web`
# and `websecure`, certificate resolver `letsencrypt`). Do NOT add a Domain for
# this application in Dokploy: it would write a third router for the same host.
# Set APP_DOMAIN in the Environment tab instead.
#
# Deploy with the command in the README ("Deploying without downtime"), set in
# Advanced -> Run Command. Dokploy's default `up -d --build` also works, but it
# stops every container before starting any, so the site is down meanwhile.
# Docker keeps a container's output without limit by default. What has to
# outlive a container goes to the error tracker (SENTRY_DSN), not here.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# What every worker container shares; each service below sets its lane.
x-worker: &worker
  logging: *logging
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the internal connection URL of the Dokploy database}
    MEDIA_ROOT: /app/media
    MALLOC_ARENA_MAX: 2
  volumes:
    - media_data:/app/media
  depends_on:
    migrate:
      condition: service_completed_successfully
  networks:
    - dokploy-network
  restart: unless-stopped

# What the two web containers share; each service below sets its routing.
x-web: &web
  logging: *logging
  build:
    context: .
    dockerfile: Dockerfile
  # Same sizing rationale as the Dockerfile CMD: ~200 MB per warmed worker.
  # Raise --workers only alongside the container's memory limit.
  # deploy/drain.sh takes the container out of the proxy's rotation before the
  # server stops.
  command: sh deploy/drain.sh gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 4
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the internal connection URL of the Dokploy database}
    MEDIA_ROOT: /app/media
    # The Dockerfile reports the host's core count, so glibc's per-thread
    # arena cap is effectively unbounded here. See README "MALLOC_ARENA_MAX".
    MALLOC_ARENA_MAX: 2
    # Longer than the healthcheck's interval x retries below.
    DRAIN_SECONDS: 25
  # DRAIN_SECONDS, then Gunicorn's 30 s to finish the requests it has.
  stop_grace_period: 70s
  volumes:
    - media_data:/app/media
  expose:
    - "8000"
  healthcheck:
    # Unhealthy while draining (deploy/drain.sh), which is what makes Traefik
    # stop routing here before the server stops.
    # The Host header must be a name in ALLOWED_HOSTS. Without it Django
    # answers 400 DisallowedHost ("Invalid HTTP_HOST header: 'localhost:8000'")
    # and the container is marked unhealthy while actually serving fine. Take
    # the first entry, since ALLOWED_HOSTS may be a comma-separated list.
    test:
      - CMD-SHELL
      - 'test ! -f /tmp/draining && curl -fsS -H "Host: $${ALLOWED_HOSTS%%,*}" http://localhost:8000/health/ || exit 1'
    interval: 5s
    timeout: 10s
    retries: 3
    start_period: 40s
  depends_on:
    migrate:
      condition: service_completed_successfully
  networks:
    - dokploy-network
  restart: unless-stopped

services:
  migrate:
    logging: *logging
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py migrate --noinput
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY_SALT: ${ENCRYPTION_KEY_SALT}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the internal connection URL of the Dokploy database}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      APP_URL: ${APP_URL}
    networks:
      - dokploy-network
    restart: "no"

  # The site. `app` takes every request; `app-standby` is the same server with a
  # lower router priority, so it takes them only while `app` is out of rotation:
  # during a deploy the standby is replaced first, then `app`, and the site never
  # goes without a container (see "Deploying without downtime" in the README).
  app:
    <<: *web
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.connektflow-web.rule=Host(`${APP_DOMAIN:?Set APP_DOMAIN to the host name of the site, e.g. app.example.com}`)
      - traefik.http.routers.connektflow-web.entrypoints=web
      - traefik.http.routers.connektflow-web.priority=200
      - traefik.http.routers.connektflow-web.middlewares=redirect-to-https@file
      - traefik.http.routers.connektflow-web.service=connektflow
      - traefik.http.routers.connektflow-websecure.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.connektflow-websecure.entrypoints=websecure
      - traefik.http.routers.connektflow-websecure.priority=200
      - traefik.http.routers.connektflow-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.connektflow-websecure.service=connektflow
      - traefik.http.services.connektflow.loadbalancer.server.port=8000

  app-standby:
    <<: *web
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.connektflow-standby-web.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.connektflow-standby-web.entrypoints=web
      - traefik.http.routers.connektflow-standby-web.priority=100
      - traefik.http.routers.connektflow-standby-web.middlewares=redirect-to-https@file
      - traefik.http.routers.connektflow-standby-web.service=connektflow-standby
      - traefik.http.routers.connektflow-standby-websecure.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.connektflow-standby-websecure.entrypoints=websecure
      - traefik.http.routers.connektflow-standby-websecure.priority=100
      - traefik.http.routers.connektflow-standby-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.connektflow-standby-websecure.service=connektflow-standby
      - traefik.http.services.connektflow-standby.loadbalancer.server.port=8000

  # One worker container per lane (apps/common/worker.py), so a crash, an
  # out-of-memory kill or a hung worker stops one kind of work and never the
  # others: a stuck account sync cannot hold up publishing or automatic
  # replies. Each process ends itself when stuck (StudioWorker.stall_reason)
  # and the restart policy brings it back. No --duration: this restart policy
  # does not depend on clean-exit recycling.
  worker-publishing:
    <<: *worker
    command: python manage.py run_studio_worker --scope publishing

  worker-realtime:
    <<: *worker
    command: python manage.py run_studio_worker --scope realtime

  worker-inbox:
    <<: *worker
    command: python manage.py run_studio_worker --scope inbox

  worker-sync:
    <<: *worker
    command: python manage.py run_studio_worker --scope sync

  worker-email:
    <<: *worker
    command: python manage.py run_studio_worker --scope email

  worker-general:
    <<: *worker
    command: python manage.py run_studio_worker --scope general

  # The media jobs under a CPU and memory cap: an FFmpeg encode takes every
  # core it is given, so here it can never starve the app, the database or the
  # other workers, and an out-of-memory kill stays inside this container
  # (fail_stalled_video_trims settles the trim it was on). Match
  # MEDIA_LIBRARY_FFMPEG_THREADS to the CPU cap.
  worker-media:
    <<: *worker
    command: python manage.py run_studio_worker --scope media
    deploy:
      resources:
        limits:
          cpus: "${MEDIA_WORKER_CPUS:-1.5}"
          memory: ${MEDIA_WORKER_MEMORY:-1g}

volumes:
  media_data:

networks:
  dokploy-network:
    external: true
