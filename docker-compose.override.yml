services:
  migrate:
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/brightbean

  app:
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/brightbean
      - DEV_SMTP_HOST=mailpit

  worker:
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/brightbean
      - DEV_SMTP_HOST=mailpit

  # Catches every mail the dev stack sends; read them at http://localhost:8025.
  # Nothing is delivered anywhere. Bound to loopback only.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    restart: unless-stopped

  tailwind:
    image: node:20-slim
    working_dir: /app/theme/static_src
    command: sh -c "npm ci && npm run start"
    volumes:
      - .:/app
      - tailwind_node_modules:/app/theme/static_src/node_modules
    init: true
    tty: true
    restart: unless-stopped

volumes:
  tailwind_node_modules:
